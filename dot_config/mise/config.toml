# pin core runtimes in one cross-platform toolchain manifest.
[settings]
# Auto-approve all prompts (fixes trust issues in flake environments)
yes = true

[tools]
bun = "1.4.3"
go = "1.27.2"
# Stay on the LTS line; jdtls and nvim-java lag behind non-LTS releases.
java = "25.0.2"
node = "26.11.1"
protobuf = "36.2"
# Held on 3.14 until 3.15 has wheels across the tooling we install.
python = "3.14.8"
# rust-analyzer is not a default component. Without it the rustup proxy in
# ~/.cargo/bin has no binary to forward to, falls back along PATH, and can
# land on mise's own shim -- which points back at the proxy.
rust = { version = "1.99.0", components = "rust-analyzer" }
zig = "0.17.0"
