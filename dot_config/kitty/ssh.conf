# preserve terminal integration and remote context across SSH sessions.
# Configuration for `kitten ssh` (kitty's ssh wrapper).
#
# What this buys over plain ssh:
#   - xterm-kitty terminfo installed on the remote automatically. This is
#     load-bearing, not cosmetic: kitty.conf sets no `term` override, so
#     TERM=xterm-kitty, and remote tmux refuses to start without that terminfo
#     entry ("open terminal failed: missing or unsuitable terminal").
#   - files pushed to the remote on connect (`copy`)
#   - ControlMaster reuse within a kitty instance (`share_connections`)
#
# The kitten only runs inside a kitty window — outside one it exits with
# "The SSH kitten is meant to run inside a kitty window". Every caller here
# falls back to plain ssh in that case; see dot_config/zsh/ssh.zsh.

hostname *

# Reuse connections within a kitty instance: second connect to a host is instant.
share_connections yes

# Push the remote login script. Source path is relative to the local HOME,
# --dest is relative to the remote HOME. It lands before login_shell is exec'd
# (bootstrap untars, then execs), so the ordering is safe.
copy --dest .local/bin/kitty-remote-login .config/ssh/remote-login

# Repo summary typed into the session by Cmd+g, which has no Lazygit to fall
# back on over ssh. Cheap to ship: it rides the same bootstrap tarball.
copy --dest .local/bin/git-overview .config/ssh/git-overview

# What remote-login should put back into KITTY_SHELL_INTEGRATION.
#
# kitty exports that variable and then unsets it again just before exec'ing the
# login shell, in the branch we land in (exec_with_shell_integration returns
# without exec'ing because our script is not named bash/zsh/fish). kitty.bash
# and the zsh integration both bail out on an empty value — `[[ -z
# "$KITTY_SHELL_INTEGRATION" ]] && builtin return` is line 4 of kitty.bash — so
# the value has to survive under a name kitty does not clear. Keep this in step
# with `shell_integration` in kitty.conf.
env KITTY_SSH_KSI=enabled

# Run that script instead of the remote login shell. It decides whether to
# attach tmux. $HOME expands on the remote — kitty emits login_shell unquoted
# (add_non_literal_env in kittens/ssh/main.go).
#
# Consequence worth knowing: because the script is not named bash/zsh/fish,
# kitty skips shell-integration injection, so the shell inside remote tmux does
# not get prompt marking. Kitty's docs already warn that shell integration
# through a multiplexer is unreliable, so this is a trade we accept rather than
# a regression to fix. Terminfo, copy, env and connection sharing all still work.
login_shell $HOME/.local/bin/kitty-remote-login
