# pin the plugins loaded by init.lua and keymap.toml; Gogh generates Yazi colors
# directly.
[[plugin.deps]]
use = "yazi-rs/plugins:git"
rev = "efa4d79"
hash = "5bb0bfab901d3601c370eafdd66edd31"

# `<C-o>` in keymap.toml: Vim's visual-mode `o`, jumping the cursor to the other
# end of the selection without disturbing it. Needs the `visual_arrow` command,
# which landed in Yazi 26.9.1 -- see the note in keymap.toml.
[[plugin.deps]]
use = "yazi-rs/plugins:visual-pivot"
rev = "4dc7f1b"
hash = "11e7b50ca963cc9a7779ddccd217ab7e"

# Draws a rounded border around the file list and the whole tab, so the panes
# read as framed panels rather than columns separated by whitespace.
[[plugin.deps]]
use = "yazi-rs/plugins:full-border"
rev = "4dc7f1b"
hash = "f281261ff04ad7ec867c3f802a50835f"

# Replaces Yazi's path header with the Starship prompt used by the shell.
[[plugin.deps]]
use = "Rolv-Apneseth/starship"
rev = "ea92cf4"
hash = "9776f378459072b6c2875eae5addc49d"

# `ya pkg` writes this section itself on a newer Yazi and rewrites the file
# without it -- which reads as drift on the next apply, and prompts. No flavors
# are installed because Gogh generates Yazi's colors directly.
[flavor]
deps = []
