# let the shell wrapper choose whether quitting Yazi also changes directory.
[[mgr.prepend_keymap]]
on = ["q"]
run = "quit --no-cwd-file"
desc = "Quit without changing directory"

[[mgr.prepend_keymap]]
# Ctrl+O returns the selected directory without overloading the ordinary quit key.
on = ["<C-o>"]
run = "quit"
desc = "Quit and cd to current directory"

[[mgr.prepend_keymap]]
on = ["F"]
run = "search --via=fd --args='--hidden --no-ignore'"
desc = "Search files by name via fd (include hidden/ignored)"

[[mgr.prepend_keymap]]
# Match Flash's Neovim key while leaving filename search available on Shift+F.
on = ["s"]
run = "plugin easyjump"
desc = "Jump to a visible file by label"
