# let the shell wrapper choose whether quitting Yazi also changes directory.
[[mgr.prepend_keymap]]
on = ["q"]
run = "quit --no-cwd-file"
desc = "Quit without changing directory"

[[mgr.prepend_keymap]]
on = ["Q"]
run = "quit"
desc = "Quit and cd to current directory"

[[mgr.prepend_keymap]]
on = ["F"]
run = "search --via=fd --args='--hidden --no-ignore'"
desc = "Search files by name via fd (include hidden/ignored)"
