# catch formatting, syntax, and secret leaks before dotfiles reach another machine.
# Pre-commit hooks for formatting and linting
# Install: pre-commit install
# Run all: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
#
# Note: Uses local Homebrew-installed tools for stylua, shfmt, taplo

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.chezmoitemplates/
      - id: end-of-file-fixer
        exclude: ^\.chezmoitemplates/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local hooks using Homebrew-provided tools
  - repo: local
    hooks:
      - id: public-boundary
        name: public boundary
        entry: scripts/check-public.sh
        language: system
        pass_filenames: false

      # Lua - stylua
      - id: stylua
        name: stylua
        entry: stylua
        language: system
        types: [lua]

      # Shell - shfmt (excludes .zsh files - zsh syntax not supported)
      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2 -ci -bn
        language: system
        types: [shell]
        exclude: \.zsh$

      # Shell static analysis. Zsh sources are excluded because ShellCheck
      # targets POSIX-family shells, not Zsh syntax.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: \.zsh$

      # Python - syntax and undefined-name checks
      - id: ruff
        name: ruff
        entry: ruff check --select E4,E7,E9,F
        language: system
        files: \.py$

      # Render executable Python templates before checking them.
      - id: ruff-python-templates
        name: ruff (rendered Python templates)
        entry: bash -o pipefail -c 'repo_root=$(git rev-parse --show-toplevel) || exit; for file; do chezmoi --source="$repo_root" execute-template < "$file" | ruff check --select E4,E7,E9,F --stdin-filename="${file%.tmpl}" - || exit; done' _
        language: system
        files: \.py\.tmpl$

      # TOML - taplo
      - id: taplo
        name: taplo
        entry: taplo fmt
        language: system
        types: [toml]

      - id: taplo-templates
        name: taplo (rendered TOML templates)
        entry: bash -o pipefail -c 'repo_root=$(git rev-parse --show-toplevel) || exit; for file; do chezmoi --source="$repo_root" execute-template < "$file" | taplo fmt --check --stdin-filepath="${file%.tmpl}" - || exit; done' _
        language: system
        files: \.toml\.tmpl$

      # Markdown, JSON, YAML - use the stable Homebrew Prettier already declared
      # in the Brewfile instead of a separately downloaded alpha release.
      - id: prettier
        name: prettier
        entry: prettier --write
        language: system
        types_or: [markdown, json, yaml]
        exclude: ^\.chezmoitemplates/
